# Free cloud deploy for Hormuud ProjectHub
# 1. Create free Supabase project → copy DATABASE_URL
# 2. Push this repo to GitHub
# 3. Connect Render.com → New Web Service → use this blueprint
# 4. Set env vars: DATABASE_URL, GROQ_API_KEY, JWT_SECRET

services:
  - type: web
    name: hormuud-projecthub
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm ci --prefix server --omit=dev
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: REQUIRE_PRODUCTION_CONFIG
        value: "true"
      - key: NODE_VERSION
        value: "22"
      - key: DB_DRIVER
        value: postgres
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
